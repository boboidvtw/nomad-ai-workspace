<!--
  Nomad Dashboard - Schedule calendar panel
  Inlined into index.html at the calendar-panel marker by composeDashboard().
  Shows each recurring schedule's planned runs, the runs it already made and shipping readback /
  target dates on a month grid in the viewer's time zone (GET /api/calendar).
  Text from the API is always set with textContent.
-->
<style>
  .cal-toolbar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .cal-month-label {
    font-weight: 600;
    min-width: 8.5rem;
    text-align: center;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 4px;
    margin-top: 0.8rem;
  }
  .cal-weekday {
    font-size: 0.7rem;
    color: var(--text-subtle);
    text-align: center;
    padding-bottom: 2px;
  }
  .cal-cell {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-sm);
    min-height: 92px;
    padding: 4px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    cursor: pointer;
    text-align: left;
    font: inherit;
    color: var(--text);
  }
  .cal-cell.outside {
    opacity: 0.45;
  }
  .cal-cell.today {
    border-color: var(--primary);
  }
  .cal-cell.selected {
    outline: 2px solid var(--cyan);
  }
  .cal-daynum {
    font-size: 0.72rem;
    color: var(--text-muted);
  }
  .cal-chip {
    font-size: 0.66rem;
    line-height: 1.3;
    border-radius: 4px;
    padding: 1px 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    border-left: 3px solid var(--text-subtle);
    background: var(--bg-surface);
  }
  .cal-chip.planned {
    border-left-color: var(--cyan);
  }
  .cal-chip.run {
    border-left-color: var(--accent);
  }
  .cal-chip.run.has-failed {
    border-left-color: var(--danger);
  }
  .cal-chip.readback {
    border-left-color: var(--warning);
  }
  .cal-chip.target {
    border-left-color: var(--purple);
  }
  .cal-more {
    font-size: 0.64rem;
    color: var(--text-subtle);
  }
  .cal-legend {
    display: flex;
    gap: 0.8rem;
    flex-wrap: wrap;
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-top: 0.6rem;
  }
  .cal-legend .cal-chip {
    display: inline-block;
  }
  .cal-detail {
    margin-top: 0.8rem;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-md);
    padding: 0.8rem;
    font-size: 0.8rem;
  }
  .cal-detail ul {
    margin: 0.4rem 0 0;
    padding-left: 1.1rem;
    display: grid;
    gap: 0.25rem;
  }
  @media (max-width: 720px) {
    .cal-cell {
      min-height: 64px;
    }
    .cal-chip {
      font-size: 0.6rem;
    }
  }
</style>

<section
  class="task-plane-section"
  id="calendar-section"
  style="display: none"
  aria-labelledby="calendar-title"
>
  <div class="task-header">
    <div>
      <h2 id="calendar-title">📅 排程行事曆</h2>
      <div style="font-size: 0.78rem; color: var(--text-muted); margin-top: 4px">
        定時排程預計何時執行、已經跑過幾次，以及交付功能的回讀到期日與目標日（依你的時區）
      </div>
    </div>
    <div class="cal-toolbar">
      <button class="bots-btn ghost" type="button" id="cal-prev" aria-label="上個月">◀</button>
      <span class="cal-month-label" id="cal-month-label" aria-live="polite"></span>
      <button class="bots-btn ghost" type="button" id="cal-next" aria-label="下個月">▶</button>
      <button class="bots-btn ghost" type="button" id="cal-today">今天</button>
      <button class="bots-btn ghost" type="button" id="cal-refresh">重新整理</button>
    </div>
  </div>
  <div class="cal-legend" aria-hidden="true">
    <span><span class="cal-chip planned">預計</span> 排程推算</span>
    <span><span class="cal-chip run">已跑</span> 排程建立的任務</span>
    <span><span class="cal-chip run has-failed">已跑</span> 含失敗</span>
    <span><span class="cal-chip readback">回讀</span> 交付回讀到期</span>
    <span><span class="cal-chip target">目標</span> 交付目標日</span>
  </div>
  <div class="bots-note" id="cal-status" role="status"></div>
  <div class="cal-grid" id="cal-grid" role="grid" aria-label="月曆"></div>
  <div class="cal-detail" id="cal-day-detail" aria-live="polite">點一天查看明細。</div>
</section>

<script>
  (function () {
    'use strict';
    var GRID_DAYS = 42;
    var MAX_CHIPS = 4;
    var WEEKDAYS = ['日', '一', '二', '三', '四', '五', '六'];
    var KIND_LABEL = { planned: '預計', run: '已跑', readback: '回讀', target: '目標' };
    var today = new Date();
    var state = { year: today.getFullYear(), month: today.getMonth(), days: {}, selected: null };

    function $(id) {
      return document.getElementById(id);
    }
    function el(tag, className, text) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }
    function pad(n) {
      return (n < 10 ? '0' : '') + n;
    }
    function dayKey(date) {
      return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate());
    }
    function timeOf(iso) {
      var d = new Date(iso);
      return pad(d.getHours()) + ':' + pad(d.getMinutes());
    }
    function gridStart() {
      var first = new Date(state.year, state.month, 1);
      return new Date(state.year, state.month, 1 - first.getDay());
    }
    function visible() {
      var section = $('calendar-section');
      return section && section.style.display !== 'none';
    }

    async function api(path) {
      var base = typeof getApiBase === 'function' ? await getApiBase() : '';
      var res = await fetch(base + path);
      return res.json().catch(function () {
        return { success: false, message: 'Invalid response' };
      });
    }

    function chipText(item) {
      var label = KIND_LABEL[item.kind] || item.kind;
      var counted = item.kind === 'planned' || item.kind === 'run';
      // The count leads so it survives the ellipsis in a narrow cell.
      return label + (counted ? ' ×' + item.count : '') + ' ' + item.title;
    }
    function chip(item) {
      var failed = item.kind === 'run' && item.statuses && item.statuses.failed > 0;
      return el('div', 'cal-chip ' + item.kind + (failed ? ' has-failed' : ''), chipText(item));
    }

    function describe(item) {
      if (item.kind === 'planned') {
        return (
          '預計 ' +
          item.title +
          '：' +
          item.count +
          ' 次，第一次 ' +
          timeOf(item.firstAt) +
          (item.assignee ? '，指派 ' + item.assignee : '')
        );
      }
      if (item.kind === 'run') {
        var parts = Object.keys(item.statuses || {}).map(function (key) {
          return key + ' ' + item.statuses[key];
        });
        return '已跑 ' + item.title + '：' + item.count + ' 次（' + parts.join('、') + '）';
      }
      if (item.kind === 'readback') {
        return '回讀到期 ' + timeOf(item.at) + ' ' + item.title + '（' + item.status + '）';
      }
      if (item.kind === 'target') return '目標日 ' + item.title + '（' + item.status + '）';
      return item.title;
    }

    function renderDetail() {
      var box = $('cal-day-detail');
      box.replaceChildren();
      if (!state.selected) {
        box.textContent = '點一天查看明細。';
        return;
      }
      box.appendChild(el('strong', '', state.selected));
      var items = state.days[state.selected] || [];
      if (items.length === 0) {
        box.appendChild(el('div', 'bots-note', '這天沒有排程或交付事項。'));
        return;
      }
      var list = el('ul');
      items.forEach(function (item) {
        list.appendChild(el('li', '', describe(item)));
      });
      box.appendChild(list);
    }

    function renderGrid() {
      var grid = $('cal-grid');
      grid.replaceChildren();
      $('cal-month-label').textContent = state.year + ' 年 ' + (state.month + 1) + ' 月';
      WEEKDAYS.forEach(function (name) {
        grid.appendChild(el('div', 'cal-weekday', name));
      });
      var start = gridStart();
      var todayKey = dayKey(new Date());
      for (var i = 0; i < GRID_DAYS; i += 1) {
        var date = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
        var key = dayKey(date);
        var cell = el('button', 'cal-cell');
        cell.type = 'button';
        cell.setAttribute('data-date', key);
        if (date.getMonth() !== state.month) cell.classList.add('outside');
        if (key === todayKey) cell.classList.add('today');
        if (key === state.selected) cell.classList.add('selected');
        cell.appendChild(el('span', 'cal-daynum', String(date.getDate())));
        var items = state.days[key] || [];
        items.slice(0, MAX_CHIPS).forEach(function (item) {
          cell.appendChild(chip(item));
        });
        if (items.length > MAX_CHIPS) {
          cell.appendChild(el('span', 'cal-more', '+' + (items.length - MAX_CHIPS)));
        }
        cell.setAttribute('aria-label', key + '，' + items.length + ' 項');
        cell.addEventListener('click', selectDay.bind(null, key));
        grid.appendChild(cell);
      }
    }

    function selectDay(key) {
      state.selected = key;
      renderGrid();
      renderDetail();
    }

    function viewerZone() {
      try {
        return Intl.DateTimeFormat().resolvedOptions().timeZone || '';
      } catch (e) {
        return '';
      }
    }

    async function load() {
      var zone = viewerZone();
      var start = gridStart();
      var end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + GRID_DAYS);
      var query =
        '?from=' +
        encodeURIComponent(start.toISOString()) +
        '&to=' +
        encodeURIComponent(end.toISOString()) +
        '&tz=' +
        new Date().getTimezoneOffset() +
        (zone ? '&timeZone=' + encodeURIComponent(zone) : '');
      $('cal-status').textContent = '載入中…';
      renderGrid();
      var json = await api('/api/calendar' + query);
      if (!json.success) {
        $('cal-status').textContent = '讀不到行事曆：' + (json.message || '未知錯誤');
        return;
      }
      state.days = {};
      json.data.days.forEach(function (day) {
        state.days[day.date] = day.items;
      });
      $('cal-status').textContent = json.data.truncated.length
        ? '有 ' + json.data.truncated.length + ' 個排程太密集，只推算了部分次數。'
        : '';
      renderGrid();
      renderDetail();
    }

    function shiftMonth(delta) {
      var d = new Date(state.year, state.month + delta, 1);
      showMonth(d.getFullYear(), d.getMonth());
    }
    function showMonth(year, month) {
      state.year = year;
      state.month = month;
      state.selected = null;
      if (visible()) return load();
      return Promise.resolve();
    }

    $('cal-prev').addEventListener('click', function () {
      shiftMonth(-1);
    });
    $('cal-next').addEventListener('click', function () {
      shiftMonth(1);
    });
    $('cal-today').addEventListener('click', function () {
      var now = new Date();
      showMonth(now.getFullYear(), now.getMonth());
    });
    $('cal-refresh').addEventListener('click', function () {
      load();
    });

    window.NomadCalendar = { show: load, showMonth: showMonth };
  })();
</script>
