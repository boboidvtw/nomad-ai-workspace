name: Release Desktop Workstation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Root Dependencies
        run: npm install --legacy-peer-deps

      - name: Build WebExtension Extension (dist_chrome)
        run: npm run build

      - name: Install Desktop Dependencies
        working-directory: packages/desktop
        run: npm install

      - name: Build Desktop Application (macOS)
        if: matrix.platform == 'mac'
        working-directory: packages/desktop
        run: npx electron-builder --mac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Desktop Application (Windows)
        if: matrix.platform == 'win'
        working-directory: packages/desktop
        run: npx electron-builder --win
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Desktop Application (Linux)
        if: matrix.platform == 'linux'
        working-directory: packages/desktop
        run: npx electron-builder --linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nomad-desktop-${{ matrix.platform }}
          path: |
            packages/desktop/dist-build/*.dmg
            packages/desktop/dist-build/*.zip
            packages/desktop/dist-build/*.exe
            packages/desktop/dist-build/*.AppImage
            packages/desktop/dist-build/*.deb
          if-no-files-found: warn

  publish:
    name: Publish GitHub Release Assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p release-files
          find all-artifacts -type f \( -name "*.dmg" -o -name "*.zip" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" \) -exec cp {} release-files/ \;
          ls -lh release-files/

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: release-files/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
